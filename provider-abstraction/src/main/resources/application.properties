# Pick one provider: anthropic | openai | bedrock-converse
spring.ai.model.chat=${CHAT_PROVIDER:anthropic}
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:unset}
spring.ai.anthropic.chat.options.model=claude-haiku-4-5-20251001
spring.ai.openai.api-key=${OPENAI_API_KEY:unset}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.bedrock.converse.chat.options.model=anthropic.claude-3-haiku-20240307-v1:0
spring.main.web-application-type=none
